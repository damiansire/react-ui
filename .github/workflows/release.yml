name: Release

# Opens a "Version Packages" PR when changesets are present, and publishes the
# changed packages to npm once that PR is merged.
#
# Requires a repo secret `NPM_TOKEN` — a classic npm Automation token (bypasses
# 2FA in CI; granular tokens tend to bounce with E403).

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        # Este job tiene el NPM_TOKEN en el entorno y produce el tarball que se
        # publica: borrar el lockfile y resolver de cero hacia una instalacion
        # irreproducible es el vector clasico de supply chain (cualquier version
        # nueva dentro del rango semver de cualquier transitiva entra al runner
        # y corre sus scripts de postinstall junto al token). `npm ci` instala
        # el arbol exacto del lockfile con integrity check. El motivo del
        # workaround viejo (npm/cli#4828) esta arreglado desde npm 10.4.
        run: npm ci

      # Never publish an artifact this pipeline did not verify. Gate the
      # publish on the same checks ci.yml runs.
      - name: Build library
        run: npm run -w react-dynamic-tables rollup-build-lib

      - name: Typecheck
        run: npm run -w react-dynamic-tables typecheck

      - name: Test
        run: npm test

      - name: Build Storybook (a11y addon)
        run: npm run -w react-dynamic-tables build-storybook

      - name: Create Release PR or publish
        uses: changesets/action@v1
        with:
          version: npm run version-packages
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
