name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # `npm ci`, no `npm install`: instala EXACTAMENTE el arbol del lockfile,
        # con integrity check y sin poder mutarlo. El workaround anterior
        # (borrar el lockfile por npm/cli#4828) ya no aplica: ese bug esta
        # arreglado desde npm 10.4 (Node 20 trae npm 10.x) y el lockfile
        # commiteado ya incluye las variantes por plataforma de rollup,
        # @rollup/rollup-linux-x64-gnu entre ellas.
        run: npm ci

      # Build primero: los type-tests, la resolución del .d.ts y el presupuesto
      # de bundle leen dist/.
      - name: Build library
        run: npm run -w react-dynamic-tables rollup-build-lib

      - name: Typecheck
        run: npm run -w react-dynamic-tables typecheck

      # Suite completa: unit + componente + a11y + type-tests + resolución .d.ts
      # + presupuesto de bundle, con el gate de cobertura (umbrales en
      # vitest.config.ts: la corrida sale con exit 1 si la cobertura baja).
      - name: Test + coverage gate
        run: npm test

      # Sólo compila Storybook: verifica que las stories no estén rotas. NO
      # ejecuta el addon de a11y (storybook build no corre addons), así que este
      # step NO es un gate de accesibilidad; el gate de a11y real es
      # Table.a11y.test.tsx (axe-core) dentro de la suite de arriba.
      - name: Build Storybook (compila stories; no gatea a11y)
        run: npm run -w react-dynamic-tables build-storybook
